[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alpr"
version = "0.1.0"
description = "Rozpoznawanie tablic rejestracyjnych: wpływ oświetlenia i poprawy obrazu na detekcję i OCR"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "pyyaml",
    "ultralytics",
    "kaggle",
]

[project.optional-dependencies]
# tylko do przebudowy zbioru (scripts/build_dataset.py)
build = ["imagecorruptions==1.1.2", "scikit-image"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["alpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# skrypty dopisują katalog repo do sys.path przed importem alpr (działają bez pip install -e .)
"scripts/*" = ["E402"]
