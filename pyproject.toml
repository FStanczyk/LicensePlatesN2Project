[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alpr"
version = "0.1.0"
description = "Rozpoznawanie tablic rejestracyjnych: wpływ oświetlenia i poprawy obrazu na detekcję i OCR"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "pyyaml",
    "ultralytics",
    "easyocr",
    "kaggle",
]

[project.optional-dependencies]
build = ["imagecorruptions==1.1.2", "scikit-image"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["alpr*"]

[tool.setuptools.package-data]
"alpr.build" = ["template/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
